  # ---- OpenAI: the API changelog, developers.openai.com/api/docs/changelog.
  - models: [gpt-5-4]
    set: { released: "2026-03-05" }
    reason: OpenAI's API changelog and its announcement give the day GPT-5.4 was released.
    evidence:
      - kind: documented
        url: https://developers.openai.com/api/docs/changelog
        date: "2026-11-25"
        note: 'Under "Mar 5" (2026): "Released GPT-5.4, our newest frontier model for professional work, to the Chat Completions and Responses API".'
      - kind: documented
        url: https://openai.com/index/introducing-gpt-5-4/
        date: "2026-11-25"
        note: 'Dated March 5, 2026: "Today, we''re releasing GPT-5.4 in ChatGPT (as GPT-5.4 Thinking), the API, and Codex."'
  - models: [gpt-5-4-mini]
    set: { released: "2026-03-17" }
    reason: OpenAI's API changelog gives the day GPT-5.4 mini was released.
    evidence:
      - kind: documented
        url: https://developers.openai.com/api/docs/changelog
        date: "2026-11-25"
        note: 'Under "Mar 17" (2026): "Released GPT-5.4 mini and GPT-5.4 nano to the Chat Completions and Responses API."'
  - models: [gpt-5-5]
    set: { released: "2026-04-23" }
    reason: >-
      OpenAI released GPT-5.5 in ChatGPT and Codex on April 23, 2026 and in the API on April 24; the release date is
      the first.
    evidence:
      - kind: documented
        url: https://openai.com/index/introducing-gpt-5-5/
        date: "2026-11-25"
        note: >-
          Dated April 23, 2026: "We're releasing GPT-5.5 ... Today, GPT-5.5 is rolling out to Plus, Pro, Business, and
          Enterprise users in ChatGPT and Codex"; "Update on April 24, 2026: GPT-5.5 and GPT-5.5 Pro are now available
          in the API."
  - models: [gpt-5-6-luna, gpt-5-6-sol, gpt-5-6-terra]
    set: { released: "2026-07-09" }
    reason: >-
      OpenAI's API changelog gives the day the GPT-5.6 family was released (after a limited preview announced on
      June 26, 2026).
    evidence:
      - kind: documented
        url: https://developers.openai.com/api/docs/changelog
        date: "2026-11-25"
        note: 'Under "Jul 9" (2026): "Released the GPT-5.6 model family, including GPT-5.6 Sol for frontier capability, GPT-5.6 Terra for a balance of intelligence and cost, and GPT-5.6 Luna for efficient, high-volume workloads."'
  - models: [gpt-6-sol]
    set: { released: "2026-09-22" }
    reason: OpenAI's API changelog gives the day GPT-6 Sol was released.
    evidence:
      - kind: documented
        url: https://developers.openai.com/api/docs/changelog
        date: "2026-11-25"
        note: 'Under "Sep 22" (2026): "Released GPT-6 Sol (gpt-6-sol) and GPT-6 Luna (gpt-6-luna)."'
  - models: [gpt-6-2-astra, gpt-6-2-sol]
    set: { released: "2026-11-17" }
