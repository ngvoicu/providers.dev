  # ---- Moonshot AI (Kimi).
  - models: [kimi-k2-6]
    set: { released: "2026-04-20" }
    reason: Kimi's help center gives the day Moonshot AI released Kimi K2.6.
    evidence:
      - kind: documented
        url: https://www.kimi.com/en/help/agent/agent-overview
        date: "2026-11-25"
        note: '"On April 20, 2026, Moonshot AI released and open-sourced the Kimi K2.6 model".'
  - models: [kimi-k2-7]
    set: { released: "2026-06" }
    reason: >-
      Devin's "Kimi K2.7" is Moonshot's Kimi K2.7 Code (Cognition calls it Kimi K2.7 Code in its own tables).
      Moonshot's platform changelog gives the month of its release; the day appears only in press and posts, so only
      the month is stated.
    evidence:
      - kind: documented
        url: https://platform.kimi.ai/docs/platform-changelog
        date: "2026-11-25"
        note: 'Under "June 2026": "Released Kimi K2.7 Code through the Open Platform API, followed by a HighSpeed variant".'
      - kind: documented
        url: https://cognition.com/blog/swe-1-7
        date: "2026-11-25"
        note: 'Cognition''s benchmark table names the model "Kimi K2.7 Code" beside SWE-1.7; its June 24, 2026 post (devin.ai/blog/kimi-k27-glm-52-devin-desktop) calls the same model "Kimi K2.7".'

  # ---- Z.ai (Zhipu): the release notes, docs.z.ai/release-notes/new-released.
