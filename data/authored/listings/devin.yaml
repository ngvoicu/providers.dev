# data/authored/listings/devin.yaml
# Release dates of the models Devin lists that have no entry here (or whose entry has no date). The date is the lab's
# release date of the model Devin serves, from the lab's own announcement, release notes, changelog, model card or
# documentation; never the day Devin added it. Devin's own name for a model (as its model list gives it) says which
# lab model an id is; where it does not say so clearly, or the lab's sources disagree, no date is stated.
#
# Not dated here, on purpose (2026-11-25):
#   deepseek-v4-flash: DeepSeek released V4-Flash as a preview on 2026-04-24 and its official version (0731) on
#     2026-07-31, and since 2026-09-10 routes the id deepseek-v4-flash to V4.1 Flash; which one Devin serves is not said.
#   swe-2-lightning, swe-2-flash-lightning: Cognition states no release of these fast variants; only SWE-2.1 Ultrafast
#     is stated to run the same model (SWE-2 was released 2026-09-10, SWE-2 Flash 2026-11-04).
provider: devin
rules:
  # ---- Anthropic: platform.claude.com, each model's overview page ("Released <date>.").
  - models: [claude-opus-4-6, claude-opus-4-6-1m]
    set: { released: "2026-02-05" }
    reason: >-
      Anthropic's page for Claude Opus 4.6 gives its release date. Devin lists claude-opus-4-6-1m as "Claude Opus 4.6
      1M", the same model with its 1M-token window.
    evidence:
      - kind: documented
        url: https://platform.claude.com/docs/en/models/opus-4-6/overview
        date: "2026-11-25"
        note: '"Legacy. Released February 5, 2026." Model ID: claude-opus-4-6, context window 1M tokens.'
