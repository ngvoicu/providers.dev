        url: https://help.openai.com/en/articles/9624314-model-release-notes
        date: "2026-11-25"
        note: 'Under "November 17, 2026": "We''re introducing GPT-6.2 Astra and GPT-6.2 Sol in the OpenAI API."'
      - kind: documented
        url: https://developers.openai.com/api/docs/changelog
        date: "2026-11-25"
        note: 'Under "Nov 17" (2026): "Use GPT-6.2 Astra for demanding reasoning and coding tasks, or GPT-6.2 Sol for everyday coding and agent workflows."'

