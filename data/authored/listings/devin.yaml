    set: { released: "2026-06-16" }
    reason: >-
      Z.ai's release notes and announcement give the day GLM-5.2 was released. Devin lists glm-5-2-1m as "GLM-5.2 High
      1M", the same model with its 1M-token context.
    evidence:
      - kind: documented
        url: https://docs.z.ai/release-notes/new-released
        date: "2026-11-25"
        note: 'Entry "2026-06-16 GLM-5.2": "Supports 1M lossless context".'
      - kind: documented
        url: https://z.ai/blog/glm-5.2
        date: "2026-11-25"
        note: 'Dated 2026-06-16: "We''re introducing GLM-5.2, our latest flagship model for long-horizon tasks."'
  - models: [glm-5-3-flash]
    set: { released: "2026-08-26" }
