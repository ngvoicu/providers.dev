        url: https://cognition.com/blog/swe-2-1
        date: "2026-11-25"
        note: 'Dated 2026.11.24: "We''re releasing SWE-2.1, a major upgrade over SWE-2." and "We are also releasing SWE-2.1 Ultrafast. Through a partnership with Cerebras, we are able to provide the same model at 10x the speed."'
