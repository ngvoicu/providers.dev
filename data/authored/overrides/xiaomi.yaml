# Xiaomi's own API: the MiMo V2.5 language models Xiaomi has retired are left out. The speech and transcription
# models of the V2.5 series (mimo-v2.5-tts, -tts-voiceclone, -tts-voicedesign, mimo-v2.5-asr) are still on Xiaomi's
# price page and stay listed, as do the V2.6 models. MiMo V2.5 at other providers is not affected by this file.
provider: xiaomi
rules:
  - models: [mimo-v2.5, mimo-v2.5-pro]
    exclude: true
    reason: >-
      Xiaomi deprecated mimo-v2.5 and mimo-v2.5-pro at 10:00 (UTC+8) on 2026-10-21; since then a request with
      either model name receives an error.
    evidence:
      - kind: documented
        url: https://mimo.mi.com/static/docs/updates/deprecate.md
        date: "2026-11-17"
        note: >-
          Table "Deprecated model on 2026.10.21": mimo-v2.5-pro and mimo-v2.5, Deprecated Time "10:00, October
          21,2026 (UTC+8)". 'Deprecation Time: The time when the name of the old model expires. After this time,
          requests using the name of the old model version will receive an error message.'
      - kind: documented
        url: https://mimo.mi.com/static/docs/price/pay-as-you-go.md
        date: "2026-11-17"
        note: >-
          '`mimo-v2.5-pro` and `mimo-v2.5` were officially deprecated at 10:00 (Beijing time) on October 21,2026.
          It is recommended to switch to the new version of the models as soon as possible.'
  - models: [mimo-v2.5-pro-ultraspeed]
    exclude: true
    reason: >-
      Xiaomi offered MiMo-V2.5-Pro-UltraSpeed only as a limited-time trial, and states that the trial has
      concluded. Its API reference and price page list mimo-v2.6-pro-ultraspeed and no V2.5 UltraSpeed model.
    evidence:
      - kind: documented
        url: https://mimo.mi.com/static/docs/news/latest/beta-extended.md
        date: "2026-11-17"
        note: >-
          Notice at the top of "Notice on the Extension of the Limited-Time Experience of MiMo-V2.5-Pro-UltraSpeed":
          'The limited-time trial (internal testing) of MiMo-V2.5-Pro-UltraSpeed has been successfully concluded.
          Thank you to every participant. The official commercial version will be launched soon, so stay tuned.'
      - kind: documented
        url: https://mimo.mi.com/static/docs/price/pay-as-you-go.md
        date: "2026-11-17"
        note: >-
          The language models priced for the real-time API are mimo-v2.6-pro, mimo-v2.6-flash and
          mimo-v2.6-pro-ultraspeed; no V2.5 UltraSpeed model is listed.
