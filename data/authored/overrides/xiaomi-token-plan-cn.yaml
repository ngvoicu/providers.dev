# Xiaomi Token Plan (China): the MiMo V2.5 language models Xiaomi has retired are left out. The Token Plan serves
# Xiaomi's own model names on its China cluster (token-plan-cn.xiaomimimo.com), and its own page says the two
# were taken offline. Its speech and transcription models and the V2.6 models stay listed.
provider: xiaomi-token-plan-cn
rules:
  - models: [mimo-v2.5, mimo-v2.5-pro]
    exclude: true
    reason: >-
      Xiaomi took mimo-v2.5 and mimo-v2.5-pro offline at 10:00 (UTC+8) on 2026-10-21, and its Token Plan page says
      so: the plan now covers mimo-v2.6-pro, mimo-v2.6-flash and the V2.5 speech and transcription models only.
    evidence:
      - kind: documented
        url: https://mimo.mi.com/static/docs/tokenplan/Token%20Plan/subscription.md
        date: "2026-11-17"
        note: >-
          'all plans support mimo-v2.6-pro, mimo-v2.6-flash, mimo-v2.5-asr, mimo-v2.5-tts-voiceclone,
          mimo-v2.5-tts-voicedesign, mimo-v2.5-tts, a total of 6 models.' 'The two models, mimo-v2.5-pro and
          mimo-v2.5, were officially taken offline at 10:00 (Beijing Time) on October 21, 2026. It is recommended
          to switch to the new version of the models as soon as possible.'
      - kind: documented
        url: https://mimo.mi.com/static/docs/tokenplan/Token%20Plan/quick-access.md
        date: "2026-11-17"
        note: >-
          The Token Plan's base URLs, OpenAI compatible protocol: 'China Cluster:
          `https://token-plan-cn.xiaomimimo.com/v1`', the address of this provider.
      - kind: documented
        url: https://mimo.mi.com/static/docs/updates/deprecate.md
        date: "2026-11-17"
        note: >-
          Table "Deprecated model on 2026.10.21": mimo-v2.5-pro and mimo-v2.5, Deprecated Time "10:00, October
          21,2026 (UTC+8)". 'Deprecation Time: The time when the name of the old model expires. After this time,
          requests using the name of the old model version will receive an error message.'
