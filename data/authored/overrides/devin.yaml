# Release dates of Devin's entries. The date is the lab's release date of the model Devin serves, from the lab's own
# release notes or announcement; never the day Devin added it. Entries created from evaluations name no lab model, so
# they inherit no date; an entry that inherits one keeps it unless the lab's own sources say otherwise.
provider: devin
rules:
  - models: [deepseek-v4-1-flash-1017]
    set: { release_date: "2026-10-17" }
    reason: >-
      DeepSeek's API change log gives the day DeepSeek-V4.1-Flash-1017 was released. Devin lists the id as "DeepSeek
      V4.1 Flash"; the id names the 1017 version.
    evidence:
      - kind: documented
        url: https://api-docs.deepseek.com/updates/
        date: "2026-11-25"
        note: 'Under "Date: 2026-10-17": "DeepSeek V4.1 Flash has been upgraded to DeepSeek-V4.1-Flash-1017."'
      - kind: documented
        url: https://api-docs.deepseek.com/news/news261017/
        date: "2026-11-25"
        note: '"DeepSeek-V4.1-Flash-1017 is here! ... Now live on our website, app, and API."'
  - models: [nemotron-3-5-super]
    set: { release_date: "2026-10-15" }
    reason: >-
      NVIDIA's announcement gives the day Nemotron 3.5 Super was released; NVIDIA's documentation says its released
      checkpoints are named Nemotron-3.5-Super-VL. (NVIDIA's technical report on the model is dated a day earlier,
      October 14, 2026; it describes the model, the blog states the release.)
    evidence:
      - kind: documented
        url: https://blogs.nvidia.com/blog/nemotron-3-5-super-vl/
        date: "2026-11-25"
        note: 'Dated October 15, 2026: "NVIDIA today released Nemotron 3.5 Super VL, an open 120-billion-parameter model".'
      - kind: documented
        url: https://docs.nvidia.com/nemotron/latest/nemotron/super35/README.html
        date: "2026-11-25"
        note: '"Training recipes for Nemotron 3.5 Super ... The released checkpoints are named Nemotron-3.5-Super-VL."'
  - models: [swe-2]
    set: { release_date: "2026-09-10" }
    reason: Cognition's announcement gives the day SWE-2 was released.
    evidence:
      - kind: documented
        url: https://cognition.com/blog/swe-2
        date: "2026-11-25"
        note: 'Dated 2026.09.10: "Today we''re introducing SWE-2, our most advanced coding model yet." and "SWE-2 is available starting today in Devin Desktop and CLI."'
  - models: [swe-2-1]
    set: { release_date: "2026-11-24" }
    reason: Cognition's announcement gives the day SWE-2.1 was released.
    evidence:
      - kind: documented
        url: https://cognition.com/blog/swe-2-1
        date: "2026-11-25"
        note: 'Dated 2026.11.24: "We''re releasing SWE-2.1, a major upgrade over SWE-2."'
  - models: [gpt-6-astra]
    set: { release_date: "2026-09-03" }
    reason: >-
      OpenAI released GPT-6 Astra on September 3, 2026 (its API changelog and system card); the date models.dev gives,
      2026-09-04, is a day later.
    evidence:
      - kind: documented
        url: https://developers.openai.com/api/docs/changelog
        date: "2026-11-25"
        note: 'Under "Sep 3" (2026): "Released GPT-6 Astra, our most capable model, built for the hardest end-to-end work."'
      - kind: documented
        url: https://deploymentsafety.openai.com/gpt-6-astra
        date: "2026-11-25"
        note: '"Published September 3, 2026" ... "Today, we are releasing GPT-6 Astra, the most capable model we have ever broadly deployed."'
