# OpenRouter lists a cached-input price for these models, and models.dev says nothing about caching for them
# (no `cache` capability). OpenRouter documents that caching is automatic for these labs.
# Proposed upstream in https://github.com/anomalyco/models.dev/pull/13412. When that is merged, the build
# reports these overrides as redundant and they can be deleted.
provider: openrouter
rules:
  - models:
      - deepseek/deepseek-chat-v3-0324
      - deepseek/deepseek-chat-v3.1
      - deepseek/deepseek-r1-0528
      - deepseek/deepseek-v3.2
      - deepseek/deepseek-v4-flash-0731
      - deepseek/deepseek-v4-flash-vision-exp
      - deepseek/deepseek-v4-flash
      - deepseek/deepseek-v4-pro-0813
      - deepseek/deepseek-v4-pro
      - deepseek/deepseek-v4.1-flash-1017
      - deepseek/deepseek-v4.1-flash
    set:
      capabilities:
        cache: { implicit: true }
    reason: OpenRouter documents that prompt caching with DeepSeek is automatic. No lifetime is documented, so none is set.
    evidence:
      - kind: documented
        url: https://openrouter.ai/docs/guides/best-practices/prompt-caching#deepseek
        date: "2026-11-13"
        note: '"Prompt caching with DeepSeek is automated and does not require any additional configuration."'
  - models:
      - moonshotai/kimi-k2-thinking
      - moonshotai/kimi-k2.5
      - moonshotai/kimi-k2.6
      - moonshotai/kimi-k2.7-code
      - moonshotai/kimi-k3.1-pro
      - moonshotai/kimi-k3
    set:
      capabilities:
        cache: { implicit: true }
    reason: OpenRouter documents that prompt caching with Moonshot AI is automatic. No lifetime is documented, so none is set.
    evidence:
      - kind: documented
        url: https://openrouter.ai/docs/guides/best-practices/prompt-caching#moonshot-ai
        date: "2026-11-13"
        note: '"Prompt caching with Moonshot AI is automated and does not require any additional configuration."'
  - models:
      - z-ai/glm-4.5-air
      - z-ai/glm-4.5
      - z-ai/glm-4.5v
      - z-ai/glm-4.6
      - z-ai/glm-4.6v
      - z-ai/glm-4.7
      - z-ai/glm-5-turbo
      - z-ai/glm-5.1
      - z-ai/glm-5.2
      - z-ai/glm-5.3-flash
      - z-ai/glm-5.3-flashx-legal
      - z-ai/glm-5.3-flashx
      - z-ai/glm-5.3-prime
      - z-ai/glm-5.3
      - z-ai/glm-5
      - z-ai/glm-5v-turbo
    set:
      capabilities:
        cache: { implicit: true }
    reason: OpenRouter documents that prompt caching with Z.AI is automatic. No lifetime is documented, so none is set.
    evidence:
      - kind: documented
        url: https://openrouter.ai/docs/guides/best-practices/prompt-caching#z-ai
        date: "2026-11-13"
        note: '"Prompt caching with Z.AI is automated and does not require any additional configuration."'
  - models:
      - meta/muse-wonder
    set:
      capabilities:
        cache: { implicit: true }
    reason: >-
      OpenRouter lists a cached-input price for this model and has no caching section for the lab. In a live check
      an immediate re-send was served from the cache.
    evidence:
      - kind: measured
        url: https://github.com/ngvoicu/groundtruth/blob/main/results/openrouter-direct/R10-2026-11-04T19-00-07.json
        date: "2026-11-04"
        note: Direct to OpenRouter, Responses API with a prompt_cache_key; 20 of 27 later re-sends were served from the cache, the oldest at 25 minutes.
  - models:
      - mistralai/mistral-large-4-0
    set:
      capabilities:
        cache: { implicit: true }
    reason: >-
      OpenRouter lists a cached-input price for this model and has no caching section for the lab. In a live check
      an immediate re-send was served from the cache.
    evidence:
      - kind: measured
        url: https://github.com/ngvoicu/groundtruth/blob/main/results/openrouter-direct/R11-2026-11-04T19-00-15.json
        date: "2026-11-04"
        note: Direct to OpenRouter, Responses API with a prompt_cache_key; 11 of 18 later re-sends were served from the cache, the oldest at 10 minutes.
  # What a request can ask of the prompt cache for Claude models at OpenRouter. models.dev documents the two
  # lifetimes (5m, 1h); this names the request field. The rule applies to every entry here that documents both.
  - select: { cache_mode: explicit, cache_ttl: ["5m", "1h"] }
    reason: OpenRouter documents the field that asks for the 1-hour cache with Claude models, and through which of its APIs.
    evidence: &retention
      - kind: documented
        url: https://openrouter.ai/docs/guides/best-practices/prompt-caching#cache-ttl-options
        date: "2026-11-14"
        note: >-
          'OpenRouter supports two cache TTL values for Anthropic: 5 minutes (default): "cache_control": { "type":
          "ephemeral" }. 1 hour: "cache_control": { "type": "ephemeral", "ttl": "1h" }.' On the Responses API: 'if
          you need to set a cache ttl, use the Chat Completions or Anthropic Messages API with cache_control.'
    request_controls:
      - id: cache.retention
        support: supported
        when: null
        bindings:
          - { location: body, path: /cache_control/ttl, scope: content_block }
        options:
          - value: null
            attributes: { retention_s: 300, profile: short }
            settings:
              - { location: body, path: /cache_control/type, scope: content_block, value: ephemeral }
            when: null
          - value: "1h"
            attributes: { retention_s: 3600, profile: long }
            settings:
              - { location: body, path: /cache_control/type, scope: content_block, value: ephemeral }
              - { location: body, path: /cache_control/ttl, scope: content_block, value: "1h" }
            when: null
        default: { value: "5m" }
        conditions:
          - Set through the Chat Completions or the Anthropic Messages API. The Responses API has no field for a cache ttl.
        evidence: *retention
