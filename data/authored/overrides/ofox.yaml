# What a request can ask of the prompt cache for Claude models at OfoxAI.
# models.dev documents the two lifetimes (5m, 1h); this names the request field, from OfoxAI's page on Claude prompt caching.
# The rule applies to every entry here that documents both lifetimes.
provider: ofox
rules:
  - select: { cache_mode: explicit, cache_ttl: ["5m", "1h"] }
    reason: OfoxAI's page on Claude prompt caching names the field that asks for the 1-hour cache.
    evidence: &source
      - kind: documented
        url: https://ofox.ai/docs/develop/models/claude/caching
        date: "2026-11-14"
        note: >-
          'Claude caching requires an explicit cache_control marker; neither endpoint caches automatically.' TTL: '5
          minutes by default, reset on each hit; "cache_control": {"type": "ephemeral", "ttl": "1h"} sets 1 hour'.
    request_controls:
      - id: cache.retention
        support: supported
        when: null
        bindings:
          - { location: body, path: /cache_control/ttl, scope: content_block }
        options:
          - value: null
            attributes: { retention_s: 300, profile: short }
            settings:
              - { location: body, path: /cache_control/type, scope: content_block, value: ephemeral }
            when: null
          - value: "1h"
            attributes: { retention_s: 3600, profile: long }
            settings:
              - { location: body, path: /cache_control/type, scope: content_block, value: ephemeral }
              - { location: body, path: /cache_control/ttl, scope: content_block, value: "1h" }
            when: null
        default: { value: "5m" }
        conditions: []
        evidence: *source
