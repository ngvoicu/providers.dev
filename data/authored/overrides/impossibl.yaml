# What a request can ask of the prompt cache for Claude models at Impossibl.
# models.dev documents the two lifetimes (5m, 1h); this names the request field, from Impossibl's page on prompt caching.
# The rule applies to every entry here that documents both lifetimes.
provider: impossibl
rules:
  - select: { cache_mode: explicit, cache_ttl: ["5m", "1h"] }
    reason: Impossibl's prompt caching page names the field that sets the cache lifetime, and its two values.
    evidence: &source
      - kind: documented
        url: https://impossibl.com/docs/prompt-caching
        date: "2026-11-14"
        note: >-
          Cache lifetime and minimum length: "Anthropic's default lifetime is five minutes, refreshed on a hit. For a
          one-hour window, use: {"cache_control": {"type": "ephemeral", "ttl": "1h"}}. 5m and 1h are the accepted TTL
          values." 'The request-level marker places one breakpoint on the last cacheable block'.
    request_controls:
      - id: cache.retention
        support: supported
        when: null
        bindings:
          - { location: body, path: /cache_control/ttl, scope: content_block }
          - { location: body, path: /cache_control/ttl, scope: request }
        options:
          - value: "5m"
            attributes: { retention_s: 300, profile: short }
            settings:
              - { location: body, path: /cache_control/type, scope: content_block, value: ephemeral }
              - { location: body, path: /cache_control/ttl, scope: content_block, value: "5m" }
            when: null
          - value: "1h"
            attributes: { retention_s: 3600, profile: long }
            settings:
              - { location: body, path: /cache_control/type, scope: content_block, value: ephemeral }
              - { location: body, path: /cache_control/ttl, scope: content_block, value: "1h" }
            when: null
        default: { value: "5m" }
        conditions: []
        evidence: *source
