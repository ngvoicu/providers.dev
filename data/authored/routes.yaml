# Where measurements land. Keys are the route names of observed.json (github.com/ngvoicu/cache-ttl-probe).
# A measurement that names a models.dev entry (`models_dev`) lands on that entry. Otherwise it lands on the
# provider named here, under the model id the route itself uses.
anthropic-api: { provider: anthropic }
openai-api: { provider: openai }
openrouter: { provider: openrouter }
meta-subscription: { provider: meta }
claude-subscription: { provider: claude-subscription }
codex-subscription: { provider: codex-subscription }
devin: { provider: devin }
antigravity: { provider: antigravity }
