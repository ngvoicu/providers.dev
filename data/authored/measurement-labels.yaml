# How the measurement file's client ids are named in what we publish, and which note parts are left out.
# The raw results stay linked from every measurement for anyone who wants the full setup.
#
# Every client has a kind (design/sources-side-by-side.md, 2.3): `direct` (plain requests sent straight to the
# provider), `own-client` (the vendor's own client) or `proxy` (requests through a proxy, plain or made by a coding
# agent). It decides which measurement gives a safe value: on an API-key entry `direct` only; on a login `own-client`,
# else `direct`, else `proxy`. Where the measurements file states a client's kind (`client_kinds`), that kind counts
# and this one is the fallback; the build warns where the two differ (`client-kind-differs`).
#
# The proxy is named (owner, 2026-11-13): a reader has to know which proxy a result went through to judge or
# repeat it. The coding agent used on top of it is not named. The proxy is Provimux (owner, 2026-11-22): our
# distribution of CLIProxyAPI, the same proxy; evaluations before 22 November 2026 went through CLIProxyAPI 8.0.53.
# The ids stay `cliproxyapi` and `agent+cliproxyapi`, as the measurements file writes them.
clients:
  direct:
    id: direct
    label: Requests sent straight to the provider
    kind: direct
  cliproxyapi:
    id: cliproxyapi
    label: Requests sent through Provimux
    kind: proxy
  pi+cliproxyapi:
    id: agent+cliproxyapi
    label: A coding agent, through Provimux
    kind: proxy
  codex-cli:
    id: codex-cli
    label: OpenAI's Codex CLI
    kind: own-client
  devin-cli:
    id: devin-cli
    label: The Devin CLI
    kind: own-client
  muse-code:
    id: muse-code
    label: Meta's Muse Code CLI
    kind: own-client
  claude-code:
    id: claude-code
    label: Anthropic's Claude Code
    kind: own-client
  antigravity-cli:
    id: antigravity-cli
    label: Google's Antigravity CLI
    kind: own-client
  # The client of groundtruth's discovery (listed.json): Provimux, the owner's proxy, which reads each login's model
  # list from the vendor. A listing names it; the measurements name the same proxy `cliproxyapi` (above).
  provimux:
    id: provimux
    label: Provimux, a proxy built on CLIProxyAPI
    kind: proxy
# A note is split on ";". A part that mentions one of these words is not published. Empty: nothing is left out.
omit_note_parts_mentioning: []
