# How the measurement file's client ids are named in what we publish, and which note parts are left out.
# The raw results stay linked from every measurement for anyone who wants the full setup.
clients:
  direct:
    id: direct
    label: Requests sent straight to the provider
  cliproxyapi:
    id: gateway
    label: Requests sent through an API gateway
  pi+cliproxyapi:
    id: agent-gateway
    label: A coding agent, through an API gateway
  codex-cli:
    id: codex-cli
    label: OpenAI's Codex CLI
  devin-cli:
    id: devin-cli
    label: The Devin CLI
  muse-code:
    id: muse-code
    label: Meta's Muse Code CLI
# A note is split on ";". A part that mentions one of these is not published.
omit_note_parts_mentioning:
  - CLIProxyAPI
  - router-for-me
