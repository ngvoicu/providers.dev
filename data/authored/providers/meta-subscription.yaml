id: meta-subscription
name: Muse Code
doc: https://dev.meta.ai/docs/muse-code/subscriptions
access: subscription
access_basis: Reached with the Muse Code API key that a Muse Code subscription applies to, not with a pay-as-you-go Meta Model API key.
note: >-
  Only models evaluated on this access method are listed. Limits and cache behaviour are not copied from the
  Meta Model API entries. Meta's page says this credential "is for use with Muse Code only". Each evaluation names
  the client it went through.
evidence:
  - kind: documented
    url: https://dev.meta.ai/docs/muse-code/subscriptions
    date: "2026-11-15"
    note: >-
      'The subscription applies to the Muse Code API key that is automatically connected in the Muse Code CLI
      onboarding process. This credential is for use with Muse Code only. Any additional API keys you create under
      your Meta Model API account will be billed through pay-as-you-go.'
  - kind: measured
    url: https://github.com/ngvoicu/groundtruth/blob/main/observed.json
    date: "2026-11-10"
    note: Cache evaluations and a context limit taken with a Muse Code subscription key.
