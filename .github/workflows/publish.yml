name: Publish

# Daily: import models.dev once, rebuild, deploy. Also on every push to main and by hand.
# A failed import never unpublishes anything: the build then uses the last good snapshot in the repository,
# and the site says that the last sync failed.
# Runs on GitHub only. A mirror that reads .github/workflows/ skips the job, so only one place commits a snapshot
# each day: on Forgejo the github context is the forgejo one, and its server_url is the Forgejo instance's URL; on
# GitHub it is https://github.com. The NAS reads .forgejo/workflows/ instead and runs only follow-github.yml there.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Download again even if models.dev says nothing changed
        type: boolean
        default: false
  push:
    branches: [main]

# One run at a time, so two syncs can never race. A second run waits for the first.
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Import models.dev and the measurements
        id: sync
        if: github.event_name != 'push'
        continue-on-error: true
        run: npm run sync -- ${{ inputs.force && '--force' || '' }}

      - name: Build the dataset and the site
        run: npm run build

      - name: Lint, type-check and test
        run: npm run check

      - name: Keep the new snapshot
        if: steps.sync.outcome == 'success'
        run: |
          # Commit only when the imported data changed, not for a new "checked at" time.
          if [ -n "$(git status --porcelain data/upstream/providers data/sources/observed.json)" ]; then
            git config user.name "providers.dev sync"
            git config user.email "actions@users.noreply.github.com"
            git add data/upstream data/sources data/sync-status.json
            git commit -m "sync: models.dev $(node -p "require('./data/upstream/meta.json').commit?.slice(0,7) ?? 'snapshot'")"
            git push
          fi

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then missing="CLOUDFLARE_API_TOKEN"; fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then missing="${missing:+$missing and }CLOUDFLARE_ACCOUNT_ID"; fi
          if [ -n "$missing" ]; then echo "Secret not set: $missing. Built and tested, not deployed."; exit 0; fi
          npx wrangler deploy

      - name: Report a failed import
        if: steps.sync.outcome == 'failure'
        run: |
          echo "::error::The import failed. The site was rebuilt from the last good snapshot. See the 'Import' step for the reason."
          exit 1
