name: Publish

# Daily, at 04:17 and 06:47 UTC: import models.dev once per run, rebuild, deploy. Also on every push to main and by
# hand. The second time is a fallback: GitHub can delay or drop a scheduled run, and none fired at 04:17 on 2026-11-17
# or 2026-11-18. Two runs a day are safe: a snapshot is committed only when the data changed, and one run is active
# at a time.
# A failed import never unpublishes anything: the build then uses the last good snapshot in the repository,
# and the site says that the last sync failed.
# Runs on GitHub only. A mirror that reads .github/workflows/ skips the job, so only one place commits a snapshot
# each day: on Forgejo the github context is the forgejo one, and its server_url is the Forgejo instance's URL; on
# GitHub it is https://github.com. The NAS reads .forgejo/workflows/ instead and runs only follow-github.yml there.
on:
  schedule:
    - cron: "17 4 * * *"
    - cron: "47 6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Download again even if a source says nothing changed
        type: boolean
        default: false
  push:
    branches: [main]

# One run at a time, so two syncs can never race. A second run waits for the first.
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Import models.dev, the measurements and pi
        id: sync
        if: github.event_name != 'push'
        continue-on-error: true
        run: npm run sync -- ${{ inputs.force && '--force' || '' }}

      - name: Warn about a failed pi import
        if: steps.sync.outputs.pi == 'failed'
        run: echo "::warning title=The pi import failed::The site is built and deployed with the last good pi snapshot; models.dev was imported as usual. See the 'Import' step for the reason."

      - name: Build the dataset and the site
        id: build
        run: npm run build

      - name: Warn about pi data left out of the build
        if: steps.build.outputs.pi == 'turned_away'
        run: echo "::warning title=The build left pi data out::The dataset is built and deployed without pi's data, or without the record of the last pi import. /api/v1/meta lists why, under issues (pi-snapshot-unreadable). The models.dev part is as usual."

      - name: Lint, type-check and test
        run: npm run check

      - name: Keep the new snapshot
        if: steps.sync.outcome == 'success'
        env:
          PI_REVISION7: ${{ steps.sync.outputs.pi_revision7 }}
        run: |
          # Commit only when the imported data changed, not for a new "checked at" time.
          if [ -n "$(git status --porcelain data/upstream/providers data/sources/observed.json data/pi/providers)" ]; then
            # The message names what changed: models.dev <commit7>, pi <revision7>, both, or the measurements.
            upstream="$(git status --porcelain data/upstream/providers)"
            pi="$(git status --porcelain data/pi/providers)"
            if [ -n "$upstream" ]; then commit7="$(node -p "require('./data/upstream/meta.json').commit?.slice(0,7) ?? 'snapshot'")"; fi
            revision7="${PI_REVISION7:-snapshot}"
            if [ -n "$upstream" ] && [ -n "$pi" ]; then message="sync: models.dev $commit7, pi $revision7"
            elif [ -n "$upstream" ]; then message="sync: models.dev $commit7"
            elif [ -n "$pi" ]; then message="sync: pi $revision7"
            else message="sync: measurements"
            fi
            git config user.name "providers.dev sync"
            git config user.email "actions@users.noreply.github.com"
            git add data/upstream data/sources data/sync-status.json
            # data/pi/ exists once a pi import has succeeded; a repository that never held one has nothing to add.
            if [ -d data/pi ]; then git add data/pi; fi
            git commit -m "$message"
            git push
          fi

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then missing="CLOUDFLARE_API_TOKEN"; fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then missing="${missing:+$missing and }CLOUDFLARE_ACCOUNT_ID"; fi
          if [ -n "$missing" ]; then echo "Secret not set: $missing. Built and tested, not deployed."; exit 0; fi
          npx wrangler deploy

      - name: Report a failed import
        if: steps.sync.outcome == 'failure'
        run: |
          echo "::error::The import failed. The site was rebuilt from the last good snapshot. See the 'Import' step for the reason."
          exit 1
