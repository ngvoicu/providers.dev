name: Follow GitHub

# Runs on the owner's Forgejo server (the NAS) only, and brings the NAS's main up to GitHub's.
# GitHub reads .github/workflows/ only, so it never sees this file. Forgejo reads .forgejo/workflows/ and, while this
# folder exists, ignores .github/workflows/: on the NAS this is the only workflow (no Publish, no Check).
# The NAS is a mirror of GitHub's main: a fast-forward when it can be one; when GitHub's main is not a descendant of
# the NAS's, the NAS's main is first kept as refs/nas-backup/main-<UTC time>, then set to GitHub's, in one atomic
# push, so no commit is lost on the NAS. Never a merge commit; GitHub is only read.
on:
  schedule:
    - cron: "3 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  follow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Bring main to GitHub's
        run: |
          set -eu
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          git fetch --no-tags https://github.com/ngvoicu/providers.dev.git "+refs/heads/main:refs/remotes/github/main"
          here=$(git rev-parse --verify "refs/remotes/origin/main^{commit}")
          github=$(git rev-parse --verify "refs/remotes/github/main^{commit}")
          echo "NAS main: $here"
          echo "GitHub main: $github"
          if [ "$here" = "$github" ]; then
            echo "Already equal."
            exit 0
          fi
          if git merge-base --is-ancestor "$here" "$github"; then
            git push --force-with-lease="refs/heads/main:$here" origin "$github:refs/heads/main"
            echo "Fast-forward: the NAS's main is now $github."
            exit 0
          fi
          # GitHub's main is not a descendant of the NAS's (a sync rebased it, or the NAS got a commit GitHub lacks).
          # The NAS is a mirror: its main is kept as refs/nas-backup/main-<UTC time>, then set to GitHub's, in one
          # atomic push that holds only while the NAS's main is still the commit read above. Only the NAS changes.
          backup="refs/nas-backup/main-$(date -u +%Y%m%dT%H%M%SZ)"
          git push --atomic --force-with-lease="refs/heads/main:$here" origin "$here:$backup" "$github:refs/heads/main"
          echo "::warning::GitHub's main is not a descendant of the NAS's. The NAS's main $here is kept as $backup; main is now $github."
